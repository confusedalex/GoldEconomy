# Infos
name: TheGoldEconomy
version: "1.13.0"
description: A simple gold based Economy plugin that just works.
author: ConfusedAlex
api-version: 1.21
folia-supported: true

# Data
main: dev.confusedalex.thegoldeconomy.TheGoldEconomy
softdepend: [ PlaceholderAPI ]
loadbefore: [ Towny, NexusAuctionHouse]
depend: [ Vault ]

permissions:
  thegoldeconomy.balance:
    default: true
  thegoldeconomy.deposit:
    default: true
  thegoldeconomy.withdraw:
    default: true
  thegoldeconomy.pay:
    default: true
  thegoldeconomy.balance.others:
    default: true
  thegoldeconomy.admin:
    default: op
  thegoldeconomy.set:
    default: op
  thegoldeconomy.add:
    default: op
  thegoldeconomy.remove:
    default: op
